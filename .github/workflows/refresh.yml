name: Refresh data from Sleeper + FFC

on:
  schedule:
    - cron: "23 10 * * *"   # daily 10:23 UTC (~6:23am ET)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch raw data
        run: python fetch_data.py
      - name: Compute site data
        run: python compute.py
      - name: Commit if changed
        run: |
          git config user.name "lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Auto-refresh data $(date -u +%F)"
            git push
          fi
