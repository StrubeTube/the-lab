<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Board — The Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/lab.css?v=50">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=50">
</head>
<body>
<div class="page">
  <div class="flex" style="justify-content:space-between;flex-wrap:wrap;gap:10px">
    <h1>The Board</h1>
    <div class="toolbar" style="margin:0">
      <input type="search" id="searchBox" placeholder="Find player…" style="width:170px">
      <button class="btn small" id="undoBtn" title="Undo last change">↩ Undo</button>
      <button class="btn small" id="exportBtn">Export</button>
      <button class="btn small" id="importBtn">Import</button>
      <button class="btn small danger" id="resetBtn">Reset</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="seg" id="posTabs"></div>
    <div class="seg" id="viewTabs">
      <button data-view="list" class="active">List</button>
      <button data-view="grid">Big Board</button>
      <button data-view="compare">Analysts</button>
    </div>
    <button class="btn small" id="addTierBtn">+ Tier</button>
    <select id="leagueOverlay" title="League overlay">
      <option value="">No league overlay</option>
      <option value="ggg">GGG overlay</option>
      <option value="lob">LOB overlay</option>
    </select>
    <label class="flex dim" id="dynWrap" style="gap:6px;font-size:12px" title="Blend your board with Dynasty ADP — view only, your saved rankings don't change">
      Dynasty lens
      <input type="range" id="dynSlider" min="0" max="100" step="5" value="0" style="width:110px;accent-color:var(--accent)">
      <span class="mono" id="dynPct" style="width:34px">0%</span>
    </label>
    <button class="btn small" id="adpLensBtn" title="Tint every row by how far your rank sits from Sleeper ADP — green = you're higher on him than the market, red = lower; deeper color = bigger gap. Position tabs compare positional rank vs positional ADP; Overall compares overall rank vs overall ADP. View only.">⇅ vs ADP</button>
  </div>

  <div id="boardRoot"></div>
</div>
<script src="vendor/sortable.min.js?v=50"></script>
<script src="js/core.js?v=50"></script>
<script src="js/board.js?v=50"></script>
</body>
</html>
